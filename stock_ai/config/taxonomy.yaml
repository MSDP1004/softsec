# AI/기술 밸류체인 taxonomy (seed)
#
# 각 노드는 밸류체인 상의 한 구간(segment)을 나타내고, tickers는 해당 구간의
# 대표 상장 기업(미국 상장 기준, ADR 포함)을 나열한다.
#
# 이 파일은 고정된 목록이 아니라 지속적으로 갱신되는 대상이다.
# `python main.py update-taxonomy` 실행 시 LLM이 최근 유망 섹터를 조사해
# 노드/티커를 추가하거나, 더 이상 유효하지 않은 항목을 제거 후보로 제안한다.
# 자동 반영은 하지 않으며, 변경 제안은 review 필드에 기록되고 사람이 최종 승인한다.

