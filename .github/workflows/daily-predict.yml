name: Daily Prediction & Calibration

on:
  schedule:
    # 21:30 UTC = 미 동부 기준 대략 장 마감 후 (평일만)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - claude/us-stock-investment-ai-f35k6j
    paths:
      - ".github/workflows/daily-predict.yml"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/us-stock-investment-ai-f35k6j

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily predict / evaluate / calibrate
        run: python main.py daily

      - name: Commit updated prediction data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv data/evaluations.csv data/shadow_predictions.csv data/daily_summary.md config/model_weights.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily prediction/evaluation update ($(date -u +%F))"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:claude/us-stock-investment-ai-f35k6j; then
              exit 0
            fi
            echo "push rejected (likely a race with another workflow), rebasing and retrying ($i)..."
            git fetch origin claude/us-stock-investment-ai-f35k6j
            git rebase origin/claude/us-stock-investment-ai-f35k6j
            sleep $((i * 3))
          done
          echo "::error::failed to push after retries"
          exit 1
